<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="rps.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="header">Play <p class="title">ROCK PAPER SCISSORS!</p></div>
    <div class="container">
        <div id="rock">
            <div class="text">Pick</div>
            <button id="rockButton">ROCK</button>
        </div>
        <div id="paper">
            <div class="text">Pick</div>
            <button id="paperButton">PAPER</button>
        </div>
        <div id="scissors">
            <div class="text">Pick</div>
            <button id="scissorsButton">SCISSORS</button>
        </div>
    </div>
    <div class="outputBox">
        <div class="score">
            <p class="playerScore">Player: </p>
            <p class="computerScore">Computer: </p>
        </div>
        <div class="outputcontainer">
            <div class="text">Round Results:</div>
            <p class="roundResults"></p>
        </div>
    </div>
</body>
</html>
